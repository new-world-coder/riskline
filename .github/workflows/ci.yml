name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24.x", "1.25.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic
      - name: Engine/ruleset coverage gate
        if: runner.os != 'Windows'
        run: |
          eng=$(go test ./pkg/engine -cover | sed -nE 's/.*coverage: ([0-9.]+)%.*/\1/p')
          rs=$(go test ./pkg/ruleset -cover | sed -nE 's/.*coverage: ([0-9.]+)%.*/\1/p')
          echo "engine=$eng ruleset=$rs"
          awk -v e="$eng" -v r="$rs" 'BEGIN{exit !((e+0)>=85 && (r+0)>=85)}'

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Start API and smoke against OpenAPI paths
        run: |
          go build -o bin/riskline-api ./cmd/riskline-api
          go build -o bin/riskline-cli ./cmd/riskline-cli
          ./bin/riskline-api -addr 127.0.0.1:18080 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/healthz && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:18080/v1/classify \
            -H 'content-type: application/json' \
            -d @examples/curl/hiring-assist.json | tee /tmp/out.json
          grep -q '"risk_tier"' /tmp/out.json
          grep -q '"disclaimer"' /tmp/out.json
          grep -q 'eu-ai-act-2024-v0.1.0' /tmp/out.json
          # Unknown regimes must be rejected (P0 ships eu-ai-act only).
          code=$(curl -s -o /tmp/bad.json -w '%{http_code}' http://127.0.0.1:18080/v1/classify \
            -H 'content-type: application/json' \
            -d '{"purpose":"x","data_types":["other"],"deployment_context":"other","autonomy_level":"content_generation","affected_population":"other","regimes":["mas-feat"]}')
          test "$code" = "400"
          grep -q 'openapi:' api/openapi.yaml
          grep -q '0.2.0-alpha' api/openapi.yaml
          ./bin/riskline-cli -list-regimes | grep -qx 'eu-ai-act'
          # TODO: swap for a full schemathesis/dredd run once clients are generated in CI
